<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murogi Bot</title>
<style>
body{background:#0b0e11;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#151a21;padding:30px;border-radius:15px;max-width:500px;margin:30px auto}
button{background:#ff444f;color:#fff;padding:15px 30px;border:0;border-radius:8px;font-weight:bold;width:100%;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>MUROGI TRADING BOT</h2>
<div id="login">
<a id="loginLink" href="#"><button>LOGIN TO DERIV</button></a>
</div>
<div id="dash" style="display:none">
<h3>Balance: <span id="bal">...</span></h3>
<button>START BOT</button>
</div>
</div>
<script>
const APP_ID = "75702";
const AFF = "KA5MGSJVX3X7";
const REDIRECT = "https://murogi-bot.onrender.com/"; // YOUR RENDER URL HERE
document.getElementById('loginLink').href = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN&brand=deriv&affiliate_token=${AFF}&redirect_uri=${REDIRECT}`;
const p = new URLSearchParams(window.location.search);
const t = p.get('token1');
if(t){
 document.getElementById('login').style.display='none';
 document.getElementById('dash').style.display='block';
 const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
 ws.onopen = ()=>ws.send(JSON.stringify({authorize:t}));
 ws.onmessage = (e)=>{
   const d = JSON.parse(e.data);
   if(d.msg_type==='authorize') ws.send(JSON.stringify({balance:1,subscribe:1}));
   if(d.msg_type==='balance') document.getElementById('bal').innerText = d.balance.balance + ' ' + d.balance.currency;
 };
}
</script>
</body>
</html>
